name: Refork upstream repository
description: Create a standalone repository from an upstream mirror and configure synchronization.
author: Reunion contributors
branding:
  icon: git-branch
  color: blue
inputs:
  source_repo_url:
    description: GitHub HTTPS/SSH URL or owner/repo to mirror (SSH forms use HTTPS with the PAT).
    required: true
    default: ''
  target_repo:
    description: Target repository name, including the owner (for example, owner/project).
    required: true
    default: ''
  visibility:
    description: Visibility of the created target repository.
    required: false
    default: private
  sync_cron:
    description: Five-field cron expression for the upstream synchronization workflow.
    required: false
    default: '0 4 * * *'
  sync_strategy:
    description: Sync strategy (merge preserves installed files; ff-only rejects divergence; rebase rewrites with a lease).
    required: false
    default: merge
  upstream_branch:
    description: Branch to synchronize from the upstream repository.
    required: false
    default: main
  target_branch:
    description: Target branch to synchronize and set as the new repository default branch.
    required: false
    default: main
  release_tag:
    description: Optional tag to create and publish as a release after provisioning.
    required: false
    default: ''
  release_asset_path:
    description: Optional asset file in the caller workspace (checkout/build it before this action).
    required: false
    default: ''
  token:
    description: Classic PAT with repo (or public_repo for public only) and workflow scopes.
    required: true
    default: ''
outputs:
  target_repo_url:
    description: URL of the created standalone target repository.
    value: ${{ steps.create-mirror.outputs.target_repo_url }}
  sync_workflow_path:
    description: Repository-relative path of the workflow committed to the target.
    value: ${{ steps.install-workflow.outputs.sync_workflow_path }}
runs:
  using: composite
  steps:
    - id: create-mirror
      name: Create standalone repository
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SOURCE_REPO_URL: ${{ inputs.source_repo_url }}
        TARGET_REPO: ${{ inputs.target_repo }}
        VISIBILITY: ${{ inputs.visibility }}
        PAT_TOKEN: ${{ inputs.token }}
        SYNC_CRON: ${{ inputs.sync_cron }}
        SYNC_STRATEGY: ${{ inputs.sync_strategy }}
        UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
        TARGET_BRANCH: ${{ inputs.target_branch }}
      run: |
        sh "$ACTION_PATH/scripts/install-sync-workflow.sh" --dry-run "$RUNNER_TEMP" "$SOURCE_REPO_URL" "$SYNC_CRON" "$SYNC_STRATEGY" "$UPSTREAM_BRANCH" "$TARGET_BRANCH" >/dev/null
        sh "$ACTION_PATH/scripts/create-mirror.sh" "$SOURCE_REPO_URL" "$TARGET_REPO"
        echo "target_repo_url=https://github.com/${TARGET_REPO}" >> "$GITHUB_OUTPUT"
    - id: install-workflow
      name: Install and push synchronization workflow to target
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        UPSTREAM_URL: ${{ inputs.source_repo_url }}
        UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
        TARGET_BRANCH: ${{ inputs.target_branch }}
        TARGET_REPO: ${{ inputs.target_repo }}
        SYNC_CRON: ${{ inputs.sync_cron }}
        SYNC_STRATEGY: ${{ inputs.sync_strategy }}
        GH_TOKEN: ${{ inputs.token }}
        GIT_TERMINAL_PROMPT: '0'
        GIT_CONFIG_COUNT: '2'
        GIT_CONFIG_KEY_0: credential.https://github.com.helper
        GIT_CONFIG_VALUE_0: ''
        GIT_CONFIG_KEY_1: credential.https://github.com.helper
        GIT_CONFIG_VALUE_1: '!gh auth git-credential'
      run: |
        target_dir=$(mktemp -d "$RUNNER_TEMP/refork-target.XXXXXX")
        trap 'rm -rf "$target_dir"' EXIT
        git clone --branch "$TARGET_BRANCH" --single-branch "https://github.com/$TARGET_REPO.git" "$target_dir"
        sh "$ACTION_PATH/scripts/install-sync-workflow.sh" "$target_dir" "$UPSTREAM_URL" "$SYNC_CRON" "$SYNC_STRATEGY" "$UPSTREAM_BRANCH" "$TARGET_BRANCH"
        git -C "$target_dir" add .github/workflows/upstream-sync.yml .github/refork/sync-upstream.sh
        git -C "$target_dir" -c user.name='refork-sync[bot]' -c user.email='refork-sync[bot]@users.noreply.github.com' commit -m 'chore: install upstream synchronization'
        git -C "$target_dir" push origin "HEAD:refs/heads/$TARGET_BRANCH"
        echo 'sync_workflow_path=.github/workflows/upstream-sync.yml' >> "$GITHUB_OUTPUT"
    - name: Publish release
      if: inputs.release_tag != ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ inputs.target_repo }}
        TARGET_BRANCH: ${{ inputs.target_branch }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        RELEASE_ASSET_PATH: ${{ inputs.release_asset_path }}
      run: sh "$ACTION_PATH/scripts/release-asset.sh" "$RELEASE_TAG" "$RELEASE_ASSET_PATH"
