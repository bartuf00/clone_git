name: Create standalone refork

on:
  workflow_dispatch:

permissions: {}

jobs:
  refork:
    runs-on: ubuntu-latest
    steps:
      - name: Create and configure standalone repository
        id: refork
        uses: bartuf00/clone_git@main
        with:
          source_repo_url: https://github.com/example/upstream.git
          target_repo: example/standalone-project
          visibility: private
          sync_cron: '0 4 * * *'
          sync_strategy: merge
          upstream_branch: main
          target_branch: main
          release_tag: ''
          release_asset_path: ''
          token: ${{ secrets.PAT_TOKEN }}
